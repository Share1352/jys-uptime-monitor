name: JYS health check

# Every student and teacher surface, every 30 minutes, from GitHub's cloud.
# This is the single central uptime watchdog; duplicate per-app health Actions
# have been removed from the application repositories.
#
# On a change of state the run emails jyslearn@gmail.com through the writing
# backend's system_alert route, naming what broke and why. It also keeps a
# single GitHub issue open for as long as anything is down.

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: jys-health-check
  cancel-in-progress: true

jobs:
  probe:
    name: Probe every JYS app
    runs-on: ubuntu-latest
    # The cold-start probes are allowed 60-75s each now, so a run in which
    # several backends are asleep needs more headroom than 15 minutes.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run the health check
        id: health
        continue-on-error: true
        env:
          HEALTH_SUMMARY_FILE: health-summary.json
          CANARY_STUDENT_EMAIL: ${{ secrets.CANARY_STUDENT_EMAIL }}
          CANARY_STUDENT_PASSWORD: ${{ secrets.CANARY_STUDENT_PASSWORD }}
        run: |
          set +e
          node scripts/health.mjs | tee health-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Take the newest known state before deciding
        run: git pull --rebase --autostash

      - name: Email the owner when something changed
        id: notify
        env:
          HEALTH_SUMMARY_FILE: health-summary.json
          HEALTH_STATE_FILE: state/health-state.json
          ALERT_BACKEND_URL: ${{ secrets.ALERT_BACKEND_URL }}
          ALERT_SHARED_SECRET: ${{ secrets.ALERT_SHARED_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/notify.mjs

      - name: Remember what is down
        run: |
          if git diff --quiet -- state/health-state.json; then
            echo "State unchanged."
            exit 0
          fi
          git config user.name "uptime-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/health-state.json
          git commit -m "chore: health state $(date -u +%FT%TZ) [skip ci]"
          git pull --rebase --autostash
          git push

      # Gated on notify.mjs, not on the health exit code: a probe that failed
      # once and passes on the next run is a flap, and four such issues were
      # opened and auto-closed in ten days, every one a false alarm. Only a
      # failure confirmed by a second consecutive run gets here.
      - name: Open or update the outage issue
        if: always() && steps.notify.outputs.confirmed_outage == 'true'
        uses: actions/github-script@v8
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('health-output.txt', 'utf8')
              .split('\n').filter((line) => !line.startsWith('::HEALTH_JSON::')).join('\n').trim();
            const title = 'A JYS app is down';
            const body = [
              'The scheduled health check failed. Opened and closed automatically.',
              '', '```', output, '```', '', `Run: ${process.env.RUN_URL}`
            ].join('\n');
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'outage'
            });
            const existing = open.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['outage']
              });
            }

      - name: Close the outage issue after a clean run
        if: always() && steps.notify.outputs.confirmed_outage == 'false'
        uses: actions/github-script@v8
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const title = 'A JYS app is down';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'outage'
            });
            const existing = open.find((issue) => issue.title === title);
            if (!existing) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number,
              body: `Every check passed again. Closing.\n\nRun: ${process.env.RUN_URL}`
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: 'closed'
            });

      # A single flap must not paint the workflow history red either, so this
      # asks the same confirmed question the issue and the email do.
      - name: Fail the run when something is down
        if: steps.notify.outputs.confirmed_outage == 'true'
        run: exit 1
