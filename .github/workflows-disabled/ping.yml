name: Keep-warm ping (cloud)

# Public repo => Actions minutes are UNLIMITED FREE and never touch the
# private 3,000-min cap. This replaces role-rush's in-repo keep-warm cron.
# Pings the public custom domain (which fronts the Render backend) so the
# free Render service does not spin down and cold-start on the first student.

on:
  schedule:
    - cron: '*/10 * * * *'   # free on a public repo
  workflow_dispatch: {}

permissions:
  contents: write   # only for the once-a-day heartbeat commit below

concurrency:
  group: keep-warm-ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Ping role-rush health
        run: |
          # Never fail the job on a transient blip (avoids alert-email spam);
          # the run log still records the HTTP status.
          code=$(curl --silent --show-error --max-time 90 --retry 2 --retry-delay 10 \
            -o /dev/null -w '%{http_code}' \
            https://role-rush.jysenglish.com/api/health || echo "000")
          echo "role-rush /api/health -> HTTP $code"

      - name: Daily heartbeat (prevents GitHub auto-disabling this cron after 60 days idle)
        run: |
          today=$(date -u +%F)
          if [ ! -f last-heartbeat.txt ] || [ "$(cat last-heartbeat.txt)" != "$today" ]; then
            echo "$today" > last-heartbeat.txt
            git config user.name "uptime-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add last-heartbeat.txt
            git commit -m "chore: heartbeat $today [skip ci]"
            git push
          fi
